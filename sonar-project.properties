sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.turbo/**,**/.git/**,**/*.min.js,**/generated/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,apps/smtp/tsconfig.json
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
